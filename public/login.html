<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>登录 - 租房管家</title>
  <script>
    (function () {
      try {
        if (localStorage.getItem('主题') === '暗黑') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="style.css?v=__版本__">
  <style>
    html, body { height: 100%; }
    body.登录页体 {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 4vw, 36px);
      background: var(--bg);
      color: var(--ink);
      position: relative;
      overflow-x: hidden;
    }

    /* 全屏自适应背景容器 */
    .背景层 {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      transition: opacity .35s ease;
    }
    .背景层.就绪 { opacity: 1; }
    .背景层 img,
    .背景层 video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .背景遮罩 {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(circle at center, rgba(19, 20, 23, 0.20), rgba(19, 20, 23, 0.52));
      opacity: 0;
      transition: opacity .35s ease;
    }
    body.有背景 .背景遮罩 { opacity: 1; }

    /* 登录卡片：直接复用设计系统 token */
    .登录卡 {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: min(400px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: clamp(24px, 4vw, 32px);
      box-shadow: var(--阴影浮);
      animation: 淡入 .25s ease-out;
    }
    /* 锁屏时钟（仅在有自定义背景时显示，替代「租房管家」标题） */
    .锁屏时钟 {
      display: none;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
      color: #FFFFFF;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.38);
      user-select: none;
    }
    .锁屏时间 {
      font-size: clamp(46px, 7vw, 64px);
      font-weight: 300;
      letter-spacing: 2px;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
    }
    .锁屏日期 {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.82);
    }

    body.有背景.登录页体 {
      flex-direction: column;
      justify-content: flex-end;
      padding-bottom: clamp(68px, 12vh, 110px);
    }
    body.有背景 .背景遮罩 {
      background: linear-gradient(180deg, rgba(10, 12, 16, 0.08) 0%, rgba(10, 12, 16, 0.16) 50%, rgba(10, 12, 16, 0.62) 100%);
    }
    /* 有背景时：macOS 锁屏式无框极简悬浮，去掉标题和糊住壁纸的大方块 */
    body.有背景 .登录卡 {
      max-width: 268px;
      padding: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      color: #FFFFFF;
    }
    body.有背景 .品牌,
    body.有背景 .表单组 label { display: none; }
    body.有背景 .锁屏时钟 { display: flex; }
    body.有背景 .表单组 { margin-bottom: 10px; }
    body.有背景 .输入盒 input {
      height: 38px;
      padding: 0 16px;
      border-radius: 999px;
      background: transparent;
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #FFFFFF;
      font-size: 13px;
      text-align: center;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.55);
    }
    body.有背景 .输入盒 input:-webkit-autofill,
    body.有背景 .输入盒 input:-webkit-autofill:hover,
    body.有背景 .输入盒 input:-webkit-autofill:focus {
      -webkit-text-fill-color: #FFFFFF;
      transition: background-color 99999s ease-in-out 0s;
    }
    body.有背景 .输入盒 input::placeholder { color: rgba(255, 255, 255, 0.72); letter-spacing: 1px; }
    body.有背景 .输入盒 input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.58);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.08);
    }
    body.有背景 .登录钮 {
      height: 38px;
      margin-top: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      border: 1px solid rgba(255, 255, 255, 0.28);
      color: #FFFFFF;
      font-size: 13px;
      font-weight: var(--fw-medium);
      letter-spacing: 3px;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.55);
    }
    body.有背景 .登录钮:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.90);
      color: #1F2329;
      border-color: transparent;
    }
    body.有背景 .错误条 {
      background: rgba(169, 63, 43, 0.42);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-color: rgba(240, 144, 125, 0.45);
      color: #FFF0ED;
      border-radius: 12px;
      text-align: center;
    }
    @keyframes 淡入 {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .品牌 {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 24px;
    }
    .图标框 {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: var(--ink);
      color: var(--surface);
      box-shadow: var(--阴影);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .品牌 h1 { font-size: var(--fs-xl); font-weight: var(--fw-semibold); letter-spacing: 0.3px; }
    .品牌 p { margin-top: 4px; font-size: var(--fs-sm); color: var(--ink-3); }
    .表单组 { margin-bottom: 16px; }
    .表单组 label {
      display: block;
      font-size: var(--fs-sm);
      font-weight: var(--fw-medium);
      color: var(--ink-3);
      margin-bottom: 6px;
    }
    .输入盒 { position: relative; display: flex; align-items: center; }
    .输入盒 input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      font-size: var(--fs-md);
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: border-color .14s, box-shadow .14s;
    }
    .输入盒 input.带按钮 { padding-right: 44px; }
    .输入盒 input:focus {
      outline: none;
      border-color: var(--ink);
      box-shadow: var(--focus-ring);
    }
    .显隐钮 {
      position: absolute;
      right: 6px;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--ink-3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .显隐钮:hover { background: var(--surface-muted); color: var(--ink); }
    .错误条 {
      display: none;
      margin-bottom: 16px;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
      font-size: var(--fs-sm);
      font-weight: var(--fw-medium);
    }
    .错误条.显示 { display: block; animation: 抖动 .25s ease; }
    @keyframes 抖动 {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    .登录钮 {
      width: 100%;
      height: 44px;
      margin-top: 4px;
      border: 0;
      border-radius: 8px;
      background: var(--ink);
      color: var(--surface);
      font-family: inherit;
      font-size: var(--fs-md);
      font-weight: var(--fw-medium);
      cursor: pointer;
      box-shadow: none;
      transition: background .14s, opacity .14s;
    }
    .登录钮:hover:not(:disabled) { background: var(--主色深); }
    .登录钮:disabled { opacity: 0.65; cursor: not-allowed; }
    .备案底栏 {
      position: fixed;
      left: 50%;
      bottom: max(10px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 2;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--ink-3);
      text-align: center;
      white-space: nowrap;
    }
    .备案底栏.显示 { display: flex; }
    .备案底栏 a {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: inherit;
      text-decoration: none;
      opacity: .85;
      transition: opacity .15s;
    }
    .备案底栏 a:hover { opacity: 1; text-decoration: underline; }
    body.有背景 .备案底栏 {
      color: rgba(255, 255, 255, .86);
      text-shadow: 0 1px 4px rgba(0, 0, 0, .45);
    }
  </style>
</head>
<body class="登录页体">
  <div class="背景层" id="背景层" aria-hidden="true"></div>
  <div class="背景遮罩" aria-hidden="true"></div>

  <div class="登录卡">
    <div class="锁屏时钟" aria-hidden="true">
      <div class="锁屏时间" id="锁屏时间"></div>
      <div class="锁屏日期" id="锁屏日期"></div>
    </div>
    <div class="品牌">
      <div class="图标框">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/><path d="M9 21v-6a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v6"/></svg>
      </div>
      <h1>租房管家</h1>
      <p>请登录您的管理账号以继续</p>
    </div>

    <form id="登录表单" autocomplete="on">
      <div class="错误条" id="错误条" role="alert"></div>

      <div class="表单组">
        <label for="用户名">用户名</label>
        <div class="输入盒">
          <input id="用户名" name="username" type="text" autocomplete="username" placeholder="账号" required autofocus>
        </div>
      </div>

      <div class="表单组">
        <label for="密码">密码</label>
        <div class="输入盒">
          <input id="密码" name="password" type="password" autocomplete="current-password" placeholder="密码" required>
        </div>
      </div>

      <div id="turnstile-wrap" style="display:none;margin:10px -16px 6px;justify-content:center"></div>

      <button type="submit" class="登录钮" id="登录钮">登 录</button>
    </form>
  </div>

  <footer class="备案底栏" id="备案底栏"></footer>

  <script>
    (function 启动锁屏时钟() {
      const 星期 = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const 刷 = () => {
        const d = new Date();
        const p = n => String(n).padStart(2, '0');
        const t = document.getElementById('锁屏时间');
        const dt = document.getElementById('锁屏日期');
        if (t) t.textContent = `${p(d.getHours())}:${p(d.getMinutes())}`;
        if (dt) dt.textContent = `${d.getMonth() + 1}月${d.getDate()}日 · ${星期[d.getDay()]}`;
      };
      刷();
      setInterval(刷, 15000);
    })();

    let tsSiteKey = '';
    let tsWidgetId = null;
    let tsToken = '';
    let tsErrMsg = '';
    let tsWaiters = [];

    function 通知Turnstile(token) {
      tsToken = token || '';
      if (tsToken) tsErrMsg = '';
      const list = tsWaiters;
      tsWaiters = [];
      list.forEach(fn => fn(tsToken));
    }

    function 等待Turnstile令牌(超时ms = 6000) {
      if (tsToken) return Promise.resolve(tsToken);
      return new Promise(resolve => {
        const timer = setTimeout(() => {
          tsWaiters = tsWaiters.filter(fn => fn !== done);
          resolve(tsToken || '');
        }, 超时ms);
        const done = tk => { clearTimeout(timer); resolve(tk || ''); };
        tsWaiters.push(done);
      });
    }

    function 挂载Turnstile(siteKey) {
      if (!siteKey) return;
      tsSiteKey = siteKey;
      const wrap = document.getElementById('turnstile-wrap');
      if (!wrap) return;
      wrap.style.display = 'flex';
      const render = () => {
        if (!window.turnstile || tsWidgetId !== null) return;
        const 暗 = document.body.classList.contains('有背景') || document.documentElement.getAttribute('data-theme') === 'dark';
        tsWidgetId = window.turnstile.render(wrap, {
          sitekey: siteKey,
          theme: 暗 ? 'dark' : 'light',
          size: 'normal',
          callback: token => 通知Turnstile(token),
          'expired-callback': () => { tsToken = ''; },
          'error-callback': code => {
            tsToken = '';
            const c = String(code || '');
            tsErrMsg = c === '110200'
              ? `当前域名（${location.hostname}）未加入 Cloudflare Turnstile 主机名白名单`
              : `人机验证加载异常（错误码 ${c || '未知'}），请检查 Site Key 或网络`;
            通知Turnstile('');
          },
        });
      };
      if (window.turnstile) { render(); return; }
      const sc = document.createElement('script');
      sc.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
      sc.async = true;
      sc.defer = true;
      sc.onload = render;
      sc.onerror = () => {
        tsErrMsg = '无法加载 Cloudflare 人机验证脚本，请检查当前网络';
        通知Turnstile('');
      };
      document.head.appendChild(sc);
    }

    (async function 加载站点信息() {
      try {
        const info = await fetch('/api/site-info').then(r => r.json());
        if (info && info.turnstileSiteKey) 挂载Turnstile(info.turnstileSiteKey);
        const icp = (info && info.ICP备案 || '').trim();
        const ga = (info && info.公安备案 || '').trim();
        if (!icp && !ga) return;
        const box = document.getElementById('备案底栏');
        if (!box) return;
        const 转 = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const 行们 = [];
        if (icp) 行们.push(`<a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">${转(icp)}</a>`);
        if (ga) {
          const 码 = (ga.match(/\d+/) || [''])[0];
          const 址 = 码 ? `https://beian.mps.gov.cn/#/query/webSearch?code=${码}` : 'https://beian.mps.gov.cn/';
          行们.push(`<a href="${址}" target="_blank" rel="noreferrer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>${转(ga)}</a>`);
        }
        box.innerHTML = 行们.join('');
        box.classList.add('显示');
      } catch (e) {}
    })();

    (async function 加载自定义背景() {
      try {
        const meta = await fetch('/api/login-bg/meta').then(r => r.json());
        if (!meta || !meta.hasBg) return;
        const 层 = document.getElementById('背景层');
        const url = '/api/login-bg?t=' + Date.now();
        if (meta.kind === 'video') {
          const v = document.createElement('video');
          v.src = url;
          v.autoplay = true;
          v.muted = true;
          v.loop = true;
          v.playsInline = true;
          v.addEventListener('loadeddata', () => {
            document.body.classList.add('有背景');
            层.classList.add('就绪');
          });
          层.appendChild(v);
        } else {
          const img = document.createElement('img');
          img.src = url;
          img.alt = '';
          img.addEventListener('load', () => {
            document.body.classList.add('有背景');
            层.classList.add('就绪');
          });
          层.appendChild(img);
        }
      } catch (e) {}
    })();

    const 表单 = document.getElementById('登录表单');
    const 错误条 = document.getElementById('错误条');
    const 登录钮 = document.getElementById('登录钮');
    const 密码框 = document.getElementById('密码');

    function 报错(msg) {
      错误条.textContent = msg;
      错误条.classList.remove('显示');
      void 错误条.offsetWidth;
      错误条.classList.add('显示');
    }

    表单.addEventListener('submit', async (e) => {
      e.preventDefault();
      错误条.classList.remove('显示');
      const 用户名 = document.getElementById('用户名').value.trim();
      const 密码 = 密码框.value;
      if (!用户名 || !密码) { 报错('请填写用户名和密码'); return; }
      if (tsSiteKey && !tsToken) {
        if (tsErrMsg) { 报错(tsErrMsg); return; }
        登录钮.disabled = true;
        登录钮.textContent = '人机验证中...';
        await 等待Turnstile令牌(6000);
        if (!tsToken) {
          登录钮.disabled = false;
          登录钮.textContent = '登 录';
          报错(tsErrMsg || '人机验证超时，请刷新页面重试');
          return;
        }
      }

      登录钮.disabled = true;
      登录钮.textContent = '正在验证...';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 用户名, 密码, turnstileToken: tsToken })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.错误) {
          报错(data.错误 || '登录失败，请重试');
          登录钮.disabled = false;
          登录钮.textContent = '登 录';
          if (tsWidgetId !== null && window.turnstile) { tsToken = ''; window.turnstile.reset(tsWidgetId); }
          密码框.focus();
          密码框.select();
          return;
        }
        location.replace('/');
      } catch (err) {
        报错('网络异常，请检查连接后重试');
        登录钮.disabled = false;
        登录钮.textContent = '登 录';
        if (tsWidgetId !== null && window.turnstile) { tsToken = ''; window.turnstile.reset(tsWidgetId); }
      }
    });
  </script>
</body>
</html>
