<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>登录 - 租房管家</title>
  <script>
    (function () {
      try {
        if (localStorage.getItem('主题') === '暗黑') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="style.css?v=__版本__">
  <style>
    html, body { height: 100%; }
    body.登录页体 {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 4vw, 36px);
      background: var(--bg);
      color: var(--ink);
      position: relative;
      overflow-x: hidden;
    }

    /* 全屏自适应背景容器 */
    .背景层 {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      transition: opacity .35s ease;
    }
    .背景层.就绪 { opacity: 1; }
    .背景层 .背景主层 {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .背景层 .背景底层 {
      display: none;
    }
    @media (max-width: 720px), (orientation: portrait) {
      .背景层 .背景底层 {
        display: block;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        filter: blur(26px) brightness(0.75);
        transform: scale(1.12);
        z-index: 0;
      }
      .背景层 .背景主层 {
        object-fit: contain;
      }
      .背景层.专属竖屏 .背景主层 {
        object-fit: cover;
      }
    }
    .背景遮罩 {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(circle at center, rgba(19, 20, 23, 0.20), rgba(19, 20, 23, 0.52));
      opacity: 0;
      transition: opacity .35s ease;
    }
    body.有背景 .背景遮罩 { opacity: 1; }

    /* 登录卡片：直接复用设计系统 token */
    .登录卡 {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: min(400px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: clamp(24px, 4vw, 32px);
      box-shadow: var(--阴影浮);
      animation: 淡入 .25s ease-out;
    }
    /* 一居中 · 双线 头部（有背景时展示，替代原时钟） */
    .双线头部 {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      color: #fbf8f2;
      user-select: none;
      position: relative;
      z-index: 2;
    }
    .双线Logo {
      display: block;
      width: clamp(240px, 28vw, 350px);
      max-height: 165px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.42));
      -webkit-user-drag: none;
    }
    .双线Logo.默认白 {
      filter: brightness(0) invert(1) drop-shadow(0 4px 18px rgba(0, 0, 0, 0.45));
    }
    .双线英 {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 22px;
      font-family: "Helvetica Neue", "Helvetica", "Arial", sans-serif;
      font-size: clamp(12px, 1.1vw, 14px);
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.88);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.48);
    }
    .双线英::before,
    .双线英::after {
      content: "";
      width: clamp(36px, 3.8vw, 56px);
      height: 1px;
      background: rgba(255, 255, 255, 0.56);
    }
    .双线英 span { padding-left: 0.42em; }
    .双线副 {
      margin-top: 10px;
      font-family: "Helvetica Neue", "Helvetica", "Arial", sans-serif;
      font-size: clamp(12px, 1vw, 14px);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.78);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.48);
    }

    body.有背景.登录页体 {
      flex-direction: column;
      justify-content: center;
      gap: clamp(34px, 6.5vh, 56px);
      padding-top: 32px;
      padding-bottom: 64px;
    }
    body.有背景 .背景遮罩 {
      background: linear-gradient(180deg, rgba(10, 12, 14, 0.22) 0%, rgba(10, 12, 14, 0.04) 36%, rgba(10, 12, 14, 0.60) 100%);
    }
    /* 有背景时：顶部居中双线标题 + 底部毛玻璃胶囊表单 */
    body.有背景 .登录卡 {
      max-width: min(320px, 88vw);
      padding: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      color: #FFFFFF;
    }
    body.有背景 .品牌,
    body.有背景 .表单组 label { display: none; }
    body.有背景 .双线头部 { display: flex; }
    body.有背景 .表单组 { margin-bottom: 12px; }
    body.有背景 .输入盒 input {
      height: 46px;
      padding: 0 20px;
      border-radius: 23px;
      background: rgba(18, 20, 24, 0.24);
      backdrop-filter: blur(var(--login-blur, 10px));
      -webkit-backdrop-filter: blur(var(--login-blur, 10px));
      border: 1px solid rgba(255, 255, 255, 0.34);
      color: #FFFFFF;
      font-size: 15px;
      text-align: center;
      letter-spacing: 0.12em;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
    }
    body.有背景 .输入盒 input:-webkit-autofill,
    body.有背景 .输入盒 input:-webkit-autofill:hover,
    body.有背景 .输入盒 input:-webkit-autofill:focus {
      -webkit-text-fill-color: #FFFFFF;
      transition: background-color 99999s ease-in-out 0s;
    }
    body.有背景 .输入盒 input::placeholder { color: rgba(255, 255, 255, 0.72); letter-spacing: 0.12em; font-size: 14px; }
    body.有背景 .输入盒 input:focus {
      background: rgba(18, 20, 24, 0.36);
      border-color: rgba(255, 255, 255, 0.72);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.12);
    }
    body.有背景 .登录钮 {
      height: 46px;
      margin-top: 4px;
      border-radius: 23px;
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(var(--login-blur, 10px));
      -webkit-backdrop-filter: blur(var(--login-blur, 10px));
      border: 1px solid rgba(255, 255, 255, 0.42);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5em;
      padding-left: 0.5em;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.22);
    }
    body.有背景 .登录钮:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.90);
      color: #1f2329;
      border-color: rgba(255, 255, 255, 0.90);
      text-shadow: none;
    }
    body.有背景 .错误条 {
      background: rgba(169, 63, 43, 0.42);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-color: rgba(240, 144, 125, 0.45);
      color: #FFF0ED;
    }
    .背景层.完整显示 .背景主层 { object-fit: contain; }
    body.有背景.表单实色 .登录卡 {
      max-width: min(360px, 90vw);
      padding: 24px 22px 22px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.92);
      color: #1f2329;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.28);
    }
    body.有背景.表单实色 .输入盒 input {
      background: rgba(0, 0, 0, 0.04);
      border-color: rgba(0, 0, 0, 0.14);
      color: #1f2329;
      text-shadow: none;
    }
    body.有背景.表单实色 .输入盒 input::placeholder { color: rgba(31, 35, 41, 0.55); }
    body.有背景.表单实色 .登录钮 {
      background: var(--accent, #18181b);
      color: #ffffff;
      border-color: transparent;
      text-shadow: none;
    }
    body.有背景.表单描边 .输入盒 input,
    body.有背景.表单描边 .登录钮 {
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border-color: rgba(255, 255, 255, 0.56);
    }
    body.有背景.文字深色 .双线头部,
    body.有背景.文字深色 .双线英,
    body.有背景.文字深色 .双线副,
    body.有背景.文字深色 .备案底栏 {
      color: #1f2329;
      text-shadow: none;
    }
    body.有背景.文字深色 .输入盒 input,
    body.有背景.文字深色 .登录钮 {
      background: rgba(255, 255, 255, 0.45);
      border-color: rgba(31, 35, 41, 0.28);
      color: #1f2329;
      text-shadow: none;
    }
    body.有背景.文字深色 .输入盒 input::placeholder { color: rgba(31, 35, 41, 0.62); }
      border-radius: 12px;
      text-align: center;
    }
    @keyframes 淡入 {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .品牌 {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 24px;
    }
    .图标框 {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: var(--ink);
      color: var(--surface);
      box-shadow: var(--阴影);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .品牌 h1 { font-size: var(--fs-xl); font-weight: var(--fw-semibold); letter-spacing: 0.3px; }
    .品牌 p { margin-top: 4px; font-size: var(--fs-sm); color: var(--ink-3); }
    .表单组 { margin-bottom: 16px; }
    .表单组 label {
      display: block;
      font-size: var(--fs-sm);
      font-weight: var(--fw-medium);
      color: var(--ink-3);
      margin-bottom: 6px;
    }
    .输入盒 { position: relative; display: flex; align-items: center; }
    .输入盒 input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      font-size: var(--fs-md);
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: border-color .14s, box-shadow .14s;
    }
    .输入盒 input.带按钮 { padding-right: 44px; }
    .输入盒 input:focus {
      outline: none;
      border-color: var(--ink);
      box-shadow: var(--focus-ring);
    }
    .显隐钮 {
      position: absolute;
      right: 6px;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--ink-3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .显隐钮:hover { background: var(--surface-muted); color: var(--ink); }
    .错误条 {
      display: none;
      margin-bottom: 16px;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
      font-size: var(--fs-sm);
      font-weight: var(--fw-medium);
    }
    .错误条.显示 { display: block; animation: 抖动 .25s ease; }
    @keyframes 抖动 {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    .登录钮 {
      width: 100%;
      height: 44px;
      margin-top: 4px;
      border: 0;
      border-radius: 8px;
      background: var(--ink);
      color: var(--surface);
      font-family: inherit;
      font-size: var(--fs-md);
      font-weight: var(--fw-medium);
      cursor: pointer;
      box-shadow: none;
      transition: background .14s, opacity .14s;
    }
    .登录钮:hover:not(:disabled) { background: var(--主色深); }
    .登录钮:disabled { opacity: 0.65; cursor: not-allowed; }
    .备案底栏 {
      position: fixed;
      left: 50%;
      bottom: max(10px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 2;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--ink-3);
      text-align: center;
      white-space: nowrap;
    }
    .备案底栏.显示 { display: flex; }
    .备案底栏 a {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: inherit;
      text-decoration: none;
      opacity: .85;
      transition: opacity .15s;
    }
    .备案底栏 a:hover { opacity: 1; text-decoration: underline; }
    body.有背景 .备案底栏 {
      color: rgba(255, 255, 255, .86);
      text-shadow: 0 1px 4px rgba(0, 0, 0, .45);
    }
  </style>
</head>
<body class="登录页体">
  <div class="背景层" id="背景层" aria-hidden="true"></div>
  <div class="背景遮罩" aria-hidden="true"></div>

  <div class="双线头部" aria-hidden="true">
    <img class="双线Logo" id="登录标题图" alt="Logo" style="display:none">
    <div class="双线英"><span>Rental Keeper</span></div>
    <div class="双线副">Property · Billing · Occupancy</div>
  </div>

  <div class="登录卡">
    <div class="品牌">
      <div class="图标框">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/><path d="M9 21v-6a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v6"/></svg>
      </div>
      <h1>租房管家</h1>
      <p>请登录您的管理账号以继续</p>
    </div>

    <form id="登录表单" autocomplete="on">
      <div class="错误条" id="错误条" role="alert"></div>

      <div class="表单组">
        <label for="用户名">用户名</label>
        <div class="输入盒">
          <input id="用户名" name="username" type="text" autocomplete="username" placeholder="账号 / Account" required autofocus>
        </div>
      </div>

      <div class="表单组">
        <label for="密码">密码</label>
        <div class="输入盒">
          <input id="密码" name="password" type="password" autocomplete="current-password" placeholder="密码 / Password" required>
        </div>
      </div>

      <div id="turnstile-wrap" style="display:none;margin:10px -16px 6px;justify-content:center"></div>

      <button type="submit" class="登录钮" id="登录钮">登 录</button>
    </form>
  </div>

  <footer class="备案底栏" id="备案底栏"></footer>

  <script>
    let tsSiteKey = '';
    let tsWidgetId = null;
    let tsToken = '';
    let tsErrMsg = '';
    let tsWaiters = [];

    function 通知Turnstile(token) {
      tsToken = token || '';
      if (tsToken) tsErrMsg = '';
      const list = tsWaiters;
      tsWaiters = [];
      list.forEach(fn => fn(tsToken));
    }

    function 上报TS异常(原因, 详情) {
      try {
        fetch('/api/login/turnstile-diag', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 原因, 详情 })
        }).catch(() => {});
      } catch (e) {}
    }

    function 等待Turnstile令牌(超时ms = 12000) {
      if (tsToken) return Promise.resolve(tsToken);
      return new Promise(resolve => {
        const timer = setTimeout(() => {
          tsWaiters = tsWaiters.filter(fn => fn !== done);
          resolve(tsToken || '');
        }, 超时ms);
        const done = tk => { clearTimeout(timer); resolve(tk || ''); };
        tsWaiters.push(done);
      });
    }

    function 挂载Turnstile(siteKey) {
      if (!siteKey) return;
      tsSiteKey = siteKey;
      const wrap = document.getElementById('turnstile-wrap');
      if (!wrap) return;
      wrap.style.display = 'flex';
      const render = () => {
        if (!window.turnstile || tsWidgetId !== null) return;
        const doRender = () => {
          if (!window.turnstile || tsWidgetId !== null || typeof window.turnstile.render !== 'function') return;
          try {
            const 暗 = document.body.classList.contains('有背景') || document.documentElement.getAttribute('data-theme') === 'dark';
            tsWidgetId = window.turnstile.render(wrap, {
              sitekey: siteKey,
              theme: 暗 ? 'dark' : 'light',
              size: 'normal',
              callback: token => 通知Turnstile(token),
              'expired-callback': () => { tsToken = ''; },
              'error-callback': code => {
                tsToken = '';
                const c = String(code || '');
                tsErrMsg = c === '110200'
                  ? `当前域名（${location.hostname}）未加入 Cloudflare Turnstile 主机名白名单`
                  : `人机验证加载异常（错误码 ${c || '未知'}），请检查 Site Key 或网络`;
                上报TS异常('error-callback', `code=${c || 'unknown'}, host=${location.hostname}`);
                通知Turnstile('');
              },
            });
          } catch (err) {
            上报TS异常('render-error', `${err && err.message || err}, host=${location.hostname}`);
          }
        };
        if (typeof window.turnstile.render === 'function') {
          doRender();
        } else if (typeof window.turnstile.ready === 'function') {
          window.turnstile.ready(doRender);
        }
      };
      if (window.turnstile) { render(); return; }
      const sc = document.createElement('script');
      sc.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
      sc.async = true;
      sc.defer = true;
      sc.onload = render;
      sc.onerror = () => {
        tsErrMsg = '无法加载 Cloudflare 人机验证脚本，请检查当前网络';
        上报TS异常('script-load-failed', `host=${location.hostname}`);
        通知Turnstile('');
      };
      document.head.appendChild(sc);
    }

    (async function 加载站点信息() {
      try {
        const info = await fetch('/api/site-info').then(r => r.json());
        if (info && info.turnstileSiteKey) 挂载Turnstile(info.turnstileSiteKey);
        if (info && info.外观 && typeof info.外观 === 'object') {
          const wg = info.外观;
          const baseCss = [];
          if (typeof wg.blur === 'number') {
            baseCss.push(`:root { --login-blur: ${wg.blur}px; }`);
          }
          if (typeof wg.overlay === 'number') {
            baseCss.push(`body.有背景 .背景遮罩 { background: rgba(10, 12, 14, ${Math.max(0, Math.min(80, wg.overlay)) / 100}); }`);
          }
          if (wg.bgFit === 'fit') {
            const bgLayer = document.getElementById('背景层');
            if (bgLayer) bgLayer.classList.add('完整显示');
          }
          if (typeof wg.logoSize === 'number') {
            baseCss.push(`#登录标题图 { height: calc(clamp(38px, 6.2vw, 66px) * ${wg.logoSize / 100}); max-width: 92vw; }`);
          }
          const logoEl = document.getElementById('登录标题图');
          if (logoEl && wg.logoTint) {
            logoEl.classList.remove('默认白');
            const wrap = document.createElement('div');
            wrap.style.cssText = 'display:inline-flex;align-items:center;justify-content:center;';
            const maskBox = document.createElement('div');
            const applyMask = () => {
              maskBox.style.cssText = `display:inline-flex;background:${wg.logoTint};-webkit-mask:url("${logoEl.src}") center/contain no-repeat;mask:url("${logoEl.src}") center/contain no-repeat;`;
            };
            logoEl.parentNode.insertBefore(wrap, logoEl);
            wrap.appendChild(maskBox);
            maskBox.appendChild(logoEl);
            logoEl.style.opacity = '0';
            logoEl.addEventListener('load', applyMask);
            applyMask();
          }
          if (typeof wg.titleY === 'number') {
            baseCss.push(`body.有背景 .双线头部 { position: fixed; left: 50%; top: ${wg.titleY}%; transform: translate(-50%, -50%); width: 100%; z-index: 2; }`);
          }
          if (typeof wg.formY === 'number') {
            baseCss.push(`body.有背景 .登录卡 { position: fixed; left: 50%; top: ${wg.formY}%; transform: translate(-50%, -50%); z-index: 2; }`);
          }
          const sub1 = document.querySelector('.双线英');
          const sub2 = document.querySelector('.双线副');
          if (Array.isArray(wg.texts)) {
            if (sub1) sub1.style.display = 'none';
            if (sub2) sub2.style.display = 'none';
            let tLayer = document.getElementById('自定义文字层');
            if (!tLayer) {
              tLayer = document.createElement('div');
              tLayer.id = '自定义文字层';
              tLayer.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:2;';
              document.body.appendChild(tLayer);
            }
            const tc = wg.textColor || '#ffffff';
            const tw = wg.textWeight || '500';
            const ts = Number(wg.textStroke) || 0;
            const tsc = wg.textStrokeColor || '#000000';
            const tsh = wg.textShadow !== undefined ? Number(wg.textShadow) : 8;
            const shCss = tsh > 0 ? `0 2px ${tsh}px rgba(0,0,0,0.65)` : 'none';
            const stCss = ts > 0 ? `${ts}px ${tsc}` : '0';
            tLayer.innerHTML = wg.texts.filter(t => t && String(t.text || '').trim()).map(t => {
              const txt = String(t.text).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
              const tr = ((Number(t.tracking) || 0) / 100).toFixed(2) + 'em';
              const sty = `position:fixed;left:${Number(t.x ?? 50)}%;top:${Number(t.y ?? 36)}%;transform:translate(-50%,-50%);font-size:${Number(t.size) || 13}px;letter-spacing:${tr};color:${t.color || tc};font-weight:${tw};text-shadow:${shCss};-webkit-text-stroke:${stCss};white-space:nowrap;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:14px;${t.line ? 'width:min(340px,82vw);' : ''}`;
              return t.line
                ? `<div class="双线英" style="${sty}"><i style="flex:1;height:1px;background:currentColor;opacity:.45"></i><span style="padding-left:${tr}">${txt}</span><i style="flex:1;height:1px;background:currentColor;opacity:.45"></i></div>`
                : `<div class="双线副" style="${sty}"><span style="padding-left:${tr}">${txt}</span></div>`;
            }).join('');
          } else {
            if (sub1) sub1.style.display = wg.showSub === false ? 'none' : 'flex';
            if (sub2) sub2.style.display = wg.showDesc === false ? 'none' : 'block';
          }
          if (wg.subtitle) {
            const subSpan = document.querySelector('.双线英 span');
            if (subSpan) subSpan.textContent = String(wg.subtitle).trim();
          }
          if (typeof wg.subDesc === 'string') {
            if (sub2) {
              sub2.textContent = wg.subDesc.trim();
              if (!wg.subDesc.trim()) sub2.style.display = 'none';
            }
          }
          if (wg.formStyle === 'solid') document.body.classList.add('表单实色');
          else if (wg.formStyle === 'outline') document.body.classList.add('表单描边');
          else if (wg.formStyle === 'minimal') document.body.classList.add('表单极简');
          if (wg.btnText) {
            const btn = document.getElementById('登录钮');
            if (btn) btn.textContent = String(wg.btnText).trim() || '登 录';
          }
          const cssRules = [];
          if (wg.formWidth || wg.inputRadius !== undefined) {
            cssRules.push(`
              ${wg.formWidth ? `body.有背景 .登录卡 { max-width: min(${Number(wg.formWidth)}px, 90vw); width: min(${Number(wg.formWidth)}px, 90vw); }` : ''}
              ${wg.inputRadius !== undefined ? `body.有背景 .输入盒 input, body.有背景 .登录钮 { border-radius: ${Number(wg.inputRadius)}px; }` : ''}
              body.有背景.表单描边 .登录卡 { padding: 22px 20px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.48); }
              body.有背景.表单极简 .输入盒 input { border: 0; border-bottom: 1px solid rgba(255,255,255,0.48); border-radius: 0; background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; }
              body.有背景.表单极简 .登录钮 { backdrop-filter: none; -webkit-backdrop-filter: none; }
            `);
          }
          if (wg.subSize || wg.subTracking) {
            const tr = wg.subTracking ? (Number(wg.subTracking) / 100).toFixed(2) + 'em' : '';
            cssRules.push(`
              body.有背景 .双线英 {
                ${wg.subSize ? `font-size: ${wg.subSize}px;` : ''}
                ${tr ? `letter-spacing: ${tr};` : ''}
              }
              ${tr ? `body.有背景 .双线英 span { padding-left: ${tr}; }` : ''}
            `);
          }
          if (wg.textColor || wg.textWeight || wg.textStroke || wg.textShadow !== undefined) {
            const tc = wg.textColor || '#ffffff';
            const tw = wg.textWeight || '500';
            const ts = Number(wg.textStroke) || 0;
            const tsc = wg.textStrokeColor || '#000000';
            const tsh = wg.textShadow !== undefined ? Number(wg.textShadow) : 8;
            const shCss = tsh > 0 ? `0 2px ${tsh}px rgba(0,0,0,0.65)` : 'none';
            const stCss = ts > 0 ? `${ts}px ${tsc}` : '0';
            cssRules.push(`
              body.有背景 .双线头部, body.有背景 .双线英, body.有背景 .双线副, body.有背景 .备案底栏 {
                color: ${tc}; font-weight: ${tw}; text-shadow: ${shCss}; -webkit-text-stroke: ${stCss};
              }
              body.有背景 .输入盒 input, body.有背景 .登录钮 {
                color: ${tc}; font-weight: ${tw}; text-shadow: ${shCss};
              }
              body.有背景 .输入盒 input::placeholder { color: ${tc}; opacity: .72; }
            `);
          }
          if ((wg.widgets && typeof wg.widgets === 'object') || (Array.isArray(wg.dividers) && wg.dividers.length)) {
            let wLayer = document.getElementById('自定义控件层');
            if (!wLayer) {
              wLayer = document.createElement('div');
              wLayer.id = '自定义控件层';
              wLayer.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:2;';
              document.body.appendChild(wLayer);
            }
            const 算节气 = d => {
              const names = ['小寒','大寒','立春','雨水','惊蛰','春分','清明','谷雨','立夏','小满','芒种','夏至','小暑','大暑','立秋','处暑','白露','秋分','寒露','霜降','立冬','小雪','大雪','冬至'];
              const y = d.getFullYear(), m = d.getMonth(), day = d.getDate();
              const c = [5.4055,20.12,3.87,18.73,5.63,20.646,4.81,20.1,5.52,21.04,5.678,21.37,7.108,22.83,7.5,23.13,7.646,23.042,8.318,23.438,7.438,22.36,7.18,21.94];
              const d1 = Math.floor((y % 100) * 0.2422 + c[m * 2]) - Math.floor((y % 100 - 1) / 4);
              const d2 = Math.floor((y % 100) * 0.2422 + c[m * 2 + 1]) - Math.floor((y % 100 - 1) / 4);
              if (day === d1) return names[m * 2];
              if (day === d2) return names[m * 2 + 1];
              return '';
            };
            const now = new Date();
            const 算农历 = mode => {
              try {
                const opt = mode === 'date' ? { day: 'numeric' } : { month: 'long', day: 'numeric' };
                return new Intl.DateTimeFormat('zh-CN-u-ca-chinese', opt).format(now);
              } catch (e) { return ''; }
            };
            const 算问候 = h => h < 6 ? '夜深了，注意休息' : (h < 11 ? '早安，祝你今日顺遂' : (h < 14 ? '午安，愿诸事顺心' : (h < 18 ? '下午好' : '晚上好')));
            const 控件HTML = [];
            const ws = wg.widgets || {};
            if (ws.clock && ws.clock.on) {
              const v = ws.clock;
              const sc = (Number(v.size) || 100) / 100;
              baseCss.push(`.登录控件-clock { position:fixed; left:${Number(v.x ?? 50)}%; top:${Number(v.y ?? 14)}%; transform:translate(-50%,-50%) scale(${sc}); color:${v.color || '#ffffff'}; text-align:center; white-space:nowrap; text-shadow:0 2px 10px rgba(0,0,0,0.55); }`);
              const sz = v.style === 'big' ? '56px;font-weight:600' : (v.style === 'mini' ? '20px;font-weight:500;letter-spacing:.14em' : '38px;font-weight:300;letter-spacing:.06em');
              const showDate = v.style !== 'mini';
              控件HTML.push(`<div class="登录控件 登录控件-clock"><div id="登录时钟时" style="font-size:${sz};line-height:1.05"></div>${showDate ? '<div id="登录时钟期" style="font-size:12px;opacity:.82;letter-spacing:.16em;margin-top:4px"></div>' : ''}</div>`);
            }
            if (ws.greeting && ws.greeting.on) {
              const v = ws.greeting;
              const sc = (Number(v.size) || 100) / 100;
              baseCss.push(`.登录控件-greeting { position:fixed; left:${Number(v.x ?? 50)}%; top:${Number(v.y ?? 21)}%; transform:translate(-50%,-50%) scale(${sc}); color:${v.color || '#ffffff'}; text-align:center; white-space:nowrap; text-shadow:0 2px 10px rgba(0,0,0,0.55); }`);
              const txt = String(v.custom || '').trim() || 算问候(now.getHours());
              控件HTML.push(`<div class="登录控件 登录控件-greeting" style="font-size:15px;font-weight:500;letter-spacing:.18em">${txt}</div>`);
            }
            if (ws.lunar && ws.lunar.mode && ws.lunar.mode !== 'hide') {
              const v = ws.lunar;
              const sc = (Number(v.size) || 100) / 100;
              baseCss.push(`.登录控件-lunar { position:fixed; left:${Number(v.x ?? 50)}%; top:${Number(v.y ?? 26)}%; transform:translate(-50%,-50%) scale(${sc}); color:${v.color || '#ffffff'}; text-align:center; white-space:nowrap; text-shadow:0 2px 10px rgba(0,0,0,0.55); }`);
              const jq = v.solarTerm !== false ? 算节气(now) : '';
              const txt = (v.mode === 'date' ? 算农历('date') : `农历 ${算农历('full')}`) + (jq ? ` · ${jq}` : '');
              控件HTML.push(`<div class="登录控件 登录控件-lunar" style="font-size:13px;letter-spacing:.22em;opacity:.88">${txt}</div>`);
            }
            const divs = Array.isArray(wg.dividers) ? wg.dividers : [];
            divs.forEach((d, idx) => {
              if (!d) return;
              const sc = (Number(d.size) || 100) / 100;
              const op = ((Number(d.opacity ?? 45)) / 100).toFixed(2);
              baseCss.push(`.登录控件-divider-${idx} { position:fixed; left:${Number(d.x ?? 50)}%; top:${Number(d.y ?? 45)}%; transform:translate(-50%,-50%) scaleX(${sc}); color:${d.color || '#ffffff'}; opacity:${op}; width:220px; height:0; border-top:1px ${d.style || 'solid'} currentColor; }`);
              控件HTML.push(`<div class="登录控件 登录控件-divider-${idx}"></div>`);
            });
            wLayer.innerHTML = 控件HTML.join('');
            const 刷时钟 = () => {
              const cur = new Date();
              const tEl = document.getElementById('登录时钟时');
              const dEl = document.getElementById('登录时钟期');
              if (tEl) tEl.textContent = cur.toTimeString().slice(0, 5);
              if (dEl) {
                const week = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][cur.getDay()];
                dEl.textContent = `${cur.getMonth() + 1}月${cur.getDate()}日 · ${week}`;
              }
            };
            if (ws.clock && ws.clock.on) { 刷时钟(); setInterval(刷时钟, 15000); }
          }
          if (baseCss.length || cssRules.length) {
            const st = document.createElement('style');
            st.id = '外观基础CSS';
            st.textContent = baseCss.concat(cssRules).join('\n');
            document.head.appendChild(st);
          }
          if (wg.customCss && String(wg.customCss).trim()) {
            const cst = document.createElement('style');
            cst.id = '自定义登录CSS';
            cst.textContent = String(wg.customCss).replace(/\/\*[\s\S]*?\*\//g, '').replace(/([^{}]+)\{([^}]*)\}/g, (_, sel, body) => {
              const impBody = body.replace(/([^;{}\s][^;{}]*?)(!important)?\s*(;|$)/g, (m, prop, imp, end) => {
                const p = prop.trim();
                if (!p || p.includes('{')) return m;
                return `${p} !important${end || ';'}`;
              });
              return `${sel} { ${impBody} }`;
            });
            document.head.appendChild(cst);
          }
          if (wg.autoContrast === false) {
            document.documentElement.style.setProperty('--auto-shadow', 'none');
          }
        }
        const icp = (info && info.ICP备案 || '').trim();
        const ga = (info && info.公安备案 || '').trim();
        if (!icp && !ga) return;
        const box = document.getElementById('备案底栏');
        if (!box) return;
        const 转 = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const 行们 = [];
        if (icp) 行们.push(`<a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">${转(icp)}</a>`);
        if (ga) {
          const 码 = (ga.match(/\d+/) || [''])[0];
          const 址 = 码 ? `https://beian.mps.gov.cn/#/query/webSearch?code=${码}` : 'https://beian.mps.gov.cn/';
          行们.push(`<a href="${址}" target="_blank" rel="noreferrer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>${转(ga)}</a>`);
        }
        box.innerHTML = 行们.join('');
        box.classList.add('显示');
      } catch (e) {}
    })();

    (async function 加载自定义背景() {
      try {
        const meta = await fetch('/api/login-bg/meta').then(r => r.json());
        if (meta && meta.logoHasBg) {
          const logoEl = document.getElementById('登录标题图');
          if (logoEl) {
            logoEl.style.display = 'block';
            logoEl.src = '/api/login-bg?target=logo&t=' + Date.now();
          }
        }
        if (!meta || (!meta.hasBg && !meta.mobileHasBg)) return;
        const 层 = document.getElementById('背景层');
        const 是竖屏 = Boolean(window.matchMedia && window.matchMedia('(max-width: 720px), (orientation: portrait)').matches);
        const 用手机图 = Boolean(是竖屏 && meta.mobileHasBg);
        const kind = 用手机图 ? meta.mobileKind : meta.kind;
        const hasTarget = 用手机图 ? meta.mobileHasBg : meta.hasBg;
        if (!hasTarget) return;
        const url = `/api/login-bg?${用手机图 ? 'target=mobile&' : ''}t=${Date.now()}`;
        if (用手机图) 层.classList.add('专属竖屏');
        if (kind === 'video') {
          const v = document.createElement('video');
          v.className = '背景主层';
          v.src = url;
          v.autoplay = true;
          v.muted = true;
          v.loop = true;
          v.playsInline = true;
          v.addEventListener('loadeddata', () => {
            document.body.classList.add('有背景');
            层.classList.add('就绪');
          });
          层.appendChild(v);
        } else {
          if (!用手机图) {
            const bgBlur = document.createElement('img');
            bgBlur.className = '背景底层';
            bgBlur.src = url;
            bgBlur.alt = '';
            层.appendChild(bgBlur);
          }
          const img = document.createElement('img');
          img.className = '背景主层';
          img.src = url;
          img.alt = '';
          img.addEventListener('load', () => {
            document.body.classList.add('有背景');
            层.classList.add('就绪');
          });
          层.appendChild(img);
        }
      } catch (e) {}
    })();

    const 表单 = document.getElementById('登录表单');
    const 错误条 = document.getElementById('错误条');
    const 登录钮 = document.getElementById('登录钮');
    const 密码框 = document.getElementById('密码');

    function 报错(msg) {
      错误条.textContent = msg;
      错误条.classList.remove('显示');
      void 错误条.offsetWidth;
      错误条.classList.add('显示');
    }

    表单.addEventListener('submit', async (e) => {
      e.preventDefault();
      错误条.classList.remove('显示');
      const 用户名 = document.getElementById('用户名').value.trim();
      const 密码 = 密码框.value;
      if (!用户名 || !密码) { 报错('请填写用户名和密码'); return; }
      if (tsSiteKey && !tsToken) {
        if (tsErrMsg) { 报错(tsErrMsg); return; }
        登录钮.disabled = true;
        登录钮.textContent = '人机验证中...';
        if (window.turnstile && tsWidgetId === null) 挂载Turnstile(tsSiteKey);
        if (window.turnstile && tsWidgetId !== null && !tsToken) {
          setTimeout(() => { if (!tsToken && window.turnstile && tsWidgetId !== null) window.turnstile.reset(tsWidgetId); }, 4500);
        }
        await 等待Turnstile令牌(12000);
        if (!tsToken) {
          登录钮.disabled = false;
          登录钮.textContent = '登 录';
          const wrap = document.getElementById('turnstile-wrap');
          const ifr = wrap && wrap.querySelector('iframe');
          const 状态 = window.turnstile
            ? `api.js已加载, widgetId=${tsWidgetId}, iframe=${ifr ? `${Math.round(ifr.getBoundingClientRect().width)}x${Math.round(ifr.getBoundingClientRect().height)}` : 'none'}`
            : 'api.js未加载完成';
          if (!tsErrMsg) 上报TS异常('token-timeout', `${状态}, host=${location.hostname}`);
          报错(tsErrMsg || '人机验证超时，请刷新页面或切换浏览器重试');
          return;
        }
      }

      登录钮.disabled = true;
      登录钮.textContent = '正在验证...';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 用户名, 密码, turnstileToken: tsToken })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.错误) {
          报错(data.错误 || '登录失败，请重试');
          登录钮.disabled = false;
          登录钮.textContent = '登 录';
          if (tsWidgetId !== null && window.turnstile) { tsToken = ''; window.turnstile.reset(tsWidgetId); }
          密码框.focus();
          密码框.select();
          return;
        }
        location.replace('/');
      } catch (err) {
        报错('网络异常，请检查连接后重试');
        登录钮.disabled = false;
        登录钮.textContent = '登 录';
        if (tsWidgetId !== null && window.turnstile) { tsToken = ''; window.turnstile.reset(tsWidgetId); }
      }
    });
  </script>
</body>
</html>
